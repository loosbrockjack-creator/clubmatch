<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="100%" height="100%" fill="#F7F6F3"/><text x="70" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#171717" text-anchor="start">ClubMatch visual tokens</text><rect x="70" y="120" width="145" height="90" rx="16" fill="#F7F6F3" stroke="#F7F6F3" stroke-width="1"/><text x="70" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Canvas</text><text x="70" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#F7F6F3</text><rect x="250" y="120" width="145" height="90" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="250" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Surface</text><text x="250" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#FFFFFF</text><rect x="430" y="120" width="145" height="90" rx="16" fill="#171717" stroke="#171717" stroke-width="1"/><text x="430" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Text</text><text x="430" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#171717</text><rect x="610" y="120" width="145" height="90" rx="16" fill="#6B6B6B" stroke="#6B6B6B" stroke-width="1"/><text x="610" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Muted</text><text x="610" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#6B6B6B</text><rect x="790" y="120" width="145" height="90" rx="16" fill="#E8E6E1" stroke="#E8E6E1" stroke-width="1"/><text x="790" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Border</text><text x="790" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#E8E6E1</text><rect x="970" y="120" width="145" height="90" rx="16" fill="#C8102E" stroke="#C8102E" stroke-width="1"/><text x="970" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Cardinal</text><text x="970" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#C8102E</text><rect x="1150" y="120" width="145" height="90" rx="16" fill="#F1BE48" stroke="#F1BE48" stroke-width="1"/><text x="1150" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717" text-anchor="start">Gold</text><text x="1150" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">#F1BE48</text><text x="70" y="330" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#171717" text-anchor="start">Radius</text><text x="70" y="360" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">12-16px cards · 14px buttons · pill only for chips</text><text x="70" y="420" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#171717" text-anchor="start">Motion</text><text x="70" y="450" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">150-250ms · ease-out · no novelty bounce</text><text x="70" y="510" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#171717" text-anchor="start">Spacing</text><text x="70" y="540" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">8px base · generous section rhythm · avoid cramped cards</text></svg>